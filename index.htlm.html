<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Η Βίβλος του Χοντρού</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #d35400;
            --primary-hover: #e67e22;
            --green: #27ae60;
            --red: #c0392b;
            --border: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
        header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 4px; }
        p.subtitle { color: var(--text-muted); font-size: 0.85rem; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: relative; }
        .tavern-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .tavern-name { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .tavern-area { font-size: 0.85rem; color: var(--text-muted); background: #2a2a2a; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-top: 4px; }
        
        .section-title { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin: 8px 0 2px; color: var(--text-muted); }
        .good { color: var(--green); }
        .bad { color: var(--red); }
        
        .links-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .btn { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-maps { background: #2980b9; }
        .btn-mb { background: #8e44ad; }
        .btn-delete { background: var(--red); }
        .btn-refresh { background: var(--green); width: 100%; margin-bottom: 16px; padding: 10px; font-size: 0.9rem; border-radius: 8px; border: none; color: white; cursor: pointer; }

        .fab { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); cursor: pointer; border: none; z-index: 100; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal-content { background: var(--card-bg); width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; border-radius: 20px 20px 0 0; border-top: 2px solid var(--primary); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 0.95rem; }
        textarea { resize: vertical; height: 70px; }
        .close-modal { float: right; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        
        .search-box { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border); color: #fff; border-radius: 10px; margin-bottom: 12px; font-size: 1rem; }
        .loading, .empty { text-align: center; color: var(--text-muted); padding: 40px; }
    </style>
</head>
<body>

    <header>
        <h1>🥩 Η Βίβλος του Χοντρού</h1>
        <p class="subtitle">Ο κοινός ιερός οδηγός της μάσας & των καλών πιάτων</p>
    </header>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 Αναζήτηση ταβέρνας, περιοχής ή πιάτου..." onkeyup="filterTaverns()">

    <button class="btn btn-refresh" onclick="loadTaverns()">🔄 Ανανέωση Λίστας από το Cloud</button>

    <div id="tavernsList">
        <div class="loading">Φόρτωση ζωντανών δεδομένων...</div>
    </div>

    <button class="fab" onclick="openModal()">+</button>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="margin-bottom: 16px; color: var(--primary);">Νέα Καταχώρηση</h2>
            <form id="tavernForm" onsubmit="submitForm(event)">
                <input type="hidden" id="editRowIndex" value="">
                <div class="form-group">
                    <label>Όνομα Ταβέρνας *</label>
                    <input type="text" id="name" required placeholder="π.χ. Ο Τσομπανάκος">
                </div>
                <div class="form-group">
                    <label>Περιοχή *</label>
                    <input type="text" id="area" required placeholder="π.χ. Καισαριανή">
                </div>
                <div class="form-group">
                    <label>Καλά Πιάτα (👍 Τι να ξαναπάρουμε)</label>
                    <textarea id="goodDishes" placeholder="π.χ. Παϊδάκια, Κοντοσούβλι, Τζατζίκι"></textarea>
                </div>
                <div class="form-group">
                    <label>Κακά Πιάτα (👎 Τι να αποφύγουμε)</label>
                    <textarea id="badDishes" placeholder="π.χ. Πατάτες κατεψυγμένες"></textarea>
                </div>
                <div class="form-group">
                    <label>Σχόλια / Εντυπώσεις</label>
                    <textarea id="comments" placeholder="Ατμόσφαιρα, τιμές, service..."></textarea>
                </div>
                <div class="form-group">
                    <label>Καταχωρήθηκε από</label>
                    <input type="text" id="author" placeholder="Το όνομά σου">
                </div>
                <div class="form-group">
                    <label>Link Google My Business</label>
                    <input type="url" id="myBusiness" placeholder="https://g.page/...">
                </div>
                <div class="form-group">
                    <label>Συντεταγμένες / GPS (π.χ. 37.9682, 23.7548)</label>
                    <input type="text" id="gps" placeholder="37.9682, 23.7548">
                </div>
                <div class="form-group">
                    <label>Link Google Maps</label>
                    <input type="url" id="maps" placeholder="https://maps.app.goo.gl/...">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem; margin-top: 10px;">Αποθήκευση στη Βάση</button>
            </form>
        </div>
    </div>

    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/t1dmkp1c7a8vm";
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjC3eXfYCd17UeY0yiXuGepwpxO2qiSQGsePZ5uzyLlWQHTcTpS_v4NbTXpRFBSJtlQQ/exec";

        let tavernsData = [];

        async function loadTaverns() {
            document.getElementById('tavernsList').innerHTML = '<div class="loading">Φόρτωση ζωντανών δεδομένων...</div>';
            try {
                const response = await fetch(SHEETDB_URL);
                if (!response.ok) throw new Error('Network error');
                const rawData = await response.json();
                
                tavernsData = rawData.map((t, idx) => ({
                    ...t,
                    _rowIndex: idx + 2
                }));

                renderTaverns(tavernsData);
            } catch (error) {
                document.getElementById('tavernsList').innerHTML = '<div class="empty">Σφάλμα φόρτωσης. Ελέγξτε τη σύνδεση.</div>';
            }
        }

        function renderTaverns(data) {
            const container = document.getElementById('tavernsList');
            if(!data || data.length === 0) {
                container.innerHTML = '<div class="empty">Δεν βρέθηκαν καταχωρήσεις.</div>';
                return;
            }
            
            container.innerHTML = data.map((t) => {
                return `
                <div class="card">
                    <div class="tavern-header">
                        <div>
                            <div class="tavern-name">${t['Όνομα Ταβέρνας'] || ''}</div>
                            <span class="tavern-area">📍 ${t['Περιοχή'] || ''}</span>
                        </div>
                    </div>
                    
                    ${t['Καλά Πιάτα'] ? `<div class="section-title good">👍 Καλά Πιάτα</div><div style="font-size:0.9rem;">${t['Καλά Πιάτα']}</div>` : ''}
                    ${t['Κακά Πιάτα'] ? `<div class="section-title bad">👎 Κακά Πιάτα</div><div style="font-size:0.9rem;">${t['Κακά Πιάτα']}</div>` : ''}
                    ${t['Σχόλια'] ? `<div class="section-title">💬 Σχόλια</div><div style="font-size:0.9rem; color:var(--text-muted);">${t['Σχόλια']}</div>` : ''}
                    
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">
                        👤 ${t['Καταχωρήθηκε από'] || 'Άγνωστος'} | 📅 ${t['Ημερομηνία'] || ''}
                    </div>

                    <div class="links-row">
                        ${t['Link Google Maps'] ? `<a href="${t['Link Google Maps']}" target="_blank" class="btn btn-maps">🗺️ Χάρτης</a>` : ''}
                        ${t['Link Google My Business'] ? `<a href="${t['Link Google My Business']}" target="_blank" class="btn btn-mb">⭐ My Business</a>` : ''}
                        ${t['Συντεταγμένες / GPS'] ? `<a href="https://maps.google.com/?q=${t['Συντεταγμένες / GPS']}" target="_blank" class="btn">📍 GPS</a>` : ''}
                        <button class="btn" style="background:#e67e22;" onclick="editTavern(${t._rowIndex})">✏️ Επεξεργασία</button>
                        <button class="btn btn-delete" onclick="deleteTavern(${t._rowIndex}, '${t['Όνομα Ταβέρνας'] || 'αυτή την ταβέρνα'}')">🗑️ Διαγραφή</button>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        function filterTaverns() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = tavernsData.filter(t => 
                (t['Όνομα Ταβέρνας'] && t['Όνομα Ταβέρνας'].toLowerCase().includes(query)) ||
                (t['Περιοχή'] && t['Περιοχή'].toLowerCase().includes(query)) ||
                (t['Καλά Πιάτα'] && t['Καλά Πιάτα'].toLowerCase().includes(query))
            );
            const container = document.getElementById('tavernsList');
            if(filtered.length === 0) {
                container.innerHTML = '<div class="empty">Δεν βρέθηκαν καταχωρήσεις.</div>';
                return;
            }
            container.innerHTML = filtered.map((t) => {
                return `
                <div class="card">
                    <div class="tavern-header">
                        <div>
                            <div class="tavern-name">${t['Όνομα Ταβέρνας'] || ''}</div>
                            <span class="tavern-area">📍 ${t['Περιοχή'] || ''}</span>
                        </div>
                    </div>
                    
                    ${t['Καλά Πιάτα'] ? `<div class="section-title good">👍 Καλά Πιάτα</div><div style="font-size:0.9rem;">${t['Καλά Πιάτα']}</div>` : ''}
                    ${t['Κακά Πιάτα'] ? `<div class="section-title bad">👎 Κακά Πιάτα</div><div style="font-size:0.9rem;">${t['Κακά Πιάτα']}</div>` : ''}
                    ${t['Σχόλια'] ? `<div class="section-title">💬 Σχόλια</div><div style="font-size:0.9rem; color:var(--text-muted);">${t['Σχόλια']}</div>` : ''}
                    
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">
                        👤 ${t['Καταχωρήθηκε από'] || 'Άγνωστος'} | 📅 ${t['Ημερομηνία'] || ''}
                    </div>

                    <div class="links-row">
                        ${t['Link Google Maps'] ? `<a href="${t['Link Google Maps']}" target="_blank" class="btn btn-maps">🗺️ Χάρτης</a>` : ''}
                        ${t['Link Google My Business'] ? `<a href="${t['Link Google My Business']}" target="_blank" class="btn btn-mb">⭐ My Business</a>` : ''}
                        ${t['Συντεταγμένες / GPS'] ? `<a href="https://maps.google.com/?q=${t['Συντεταγμένες / GPS']}" target="_blank" class="btn">📍 GPS</a>` : ''}
                        <button class="btn" style="background:#e67e22;" onclick="editTavern(${t._rowIndex})">✏️ Επεξεργασία</button>
                        <button class="btn btn-delete" onclick="deleteTavern(${t._rowIndex}, '${t['Όνομα Ταβέρνας'] || 'αυτή την ταβέρνα'}')">🗑️ Διαγραφή</button>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        function openModal() { 
            document.getElementById('editRowIndex').value = '';
            document.getElementById('modalTitle').textContent = 'Νέα Καταχώρηση';
            document.getElementById('tavernForm').reset();
            document.getElementById('addModal').style.display = 'flex'; 
        }

        function closeModal() { 
            document.getElementById('addModal').style.display = 'none'; 
        }

        function editTavern(rowIndex) {
            const t = tavernsData.find(item => Number(item._rowIndex) === Number(rowIndex));
            if (!t) return;

            document.getElementById('editRowIndex').value = t._rowIndex;
            document.getElementById('modalTitle').textContent = 'Επεξεργασία Ταβέρνας';
            document.getElementById('name').value = t['Όνομα Ταβέρνας'] || '';
            document.getElementById('area').value = t['Περιοχή'] || '';
            document.getElementById('goodDishes').value = t['Καλά Πιάτα'] || '';
            document.getElementById('badDishes').value = t['Κακά Πιάτα'] || '';
            document.getElementById('comments').value = t['Σχόλια'] || '';
            document.getElementById('author').value = t['Καταχωρήθηκε από'] || '';
            document.getElementById('myBusiness').value = t['Link Google My Business'] || '';
            document.getElementById('gps').value = t['Συντεταγμένες / GPS'] || '';
            document.getElementById('maps').value = t['Link Google Maps'] || '';

            document.getElementById('addModal').style.display = 'flex';
        }

        async function deleteTavern(rowIndex, name) {
            if (!confirm(`Σίγουρα θέλεις να διαγράψεις "${name}";`)) return;

            try {
                // Delete via SheetDB
                await fetch(`${SHEETDB_URL}/Όνομα Ταβέρνας/${encodeURIComponent(name)}`, {
                    method: 'DELETE',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
                });

                alert('Η ταβέρνα διαγράφηκε επιτυχώς!');
                setTimeout(loadTaverns, 1000);
            } catch (error) {
                // Fallback to Apps Script iframe delete if SheetDB delete fails
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = APPS_SCRIPT_URL + "?action=delete&rowIndex=" + rowIndex;
                document.body.appendChild(iframe);
                setTimeout(() => {
                    document.body.removeChild(iframe);
                    alert('Η ταβέρνα διαγράφηκε επιτυχώς!');
                    loadTaverns();
                }, 1500);
            }
        }

        async function submitForm(e) {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = 'Αποθήκευση...';
            btn.disabled = true;

            const editRowIndex = document.getElementById('editRowIndex').value;
            const payload = {
                "Όνομα Ταβέρνας": document.getElementById('name').value,
                "Περιοχή": document.getElementById('area').value,
                "Καλά Πιάτα": document.getElementById('goodDishes').value,
                "Κακά Πιάτα": document.getElementById('badDishes').value,
                "Σχόλια": document.getElementById('comments').value,
                "Καταχωρήθηκε από": document.getElementById('author').value,
                "Link Google My Business": document.getElementById('myBusiness').value,
                "Συντεταγμένες / GPS": document.getElementById('gps').value,
                "Link Google Maps": document.getElementById('maps').value,
                "Ημερομηνία": new Date().toISOString().split('T')[0]
            };

            try {
                let url = SHEETDB_URL;
                let method = 'POST';

                if (editRowIndex) {
                    const tavernName = tavernsData.find(item => Number(item._rowIndex) === Number(editRowIndex))?.['Όνομα Ταβέρνας'];
                    if (tavernName) {
                        url = `${SHEETDB_URL}/Όνομα Ταβέρνας/${encodeURIComponent(tavernName)}`;
                        method = 'PUT';
                    }
                }

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(editRowIndex ? { data: payload } : payload)
                });

                if (!response.ok) throw new Error('Network error');

                alert(editRowIndex ? 'Η ταβέρνα ενημερώθηκε επιτυχώς!' : 'Η ταβέρνα προστέθηκε επιτυχώς!');
                closeModal();
                document.getElementById('tavernForm').reset();
                btn.textContent = 'Αποθήκευση στη Βάση';
                btn.disabled = false;
                setTimeout(loadTaverns, 1000);
            } catch (error) {
                alert('Σφάλμα αποθήκευσης.');
                btn.textContent = 'Αποθήκευση στη Βάση';
                btn.disabled = false;
            }
        }

        loadTaverns();
    </script>
</body>
</html>
